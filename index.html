    <!-- GitHub Pages SPA redirect: restore route after 404.html redirect -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          try {
            var r = JSON.parse(redirect);
            var url = '/' + r.path + (r.search || '') + (r.hash || '');
            history.replaceState(null, '', url);
          } catch(e) {}
        }
      })();
    </script>
